# NetworkManager on the Alpine appliance. Profiles are keyfiles in the persistent
# /etc/NetworkManager/system-connections (p3); authorization through polkit
# (/etc/polkit-1/rules.d/49-nibe-gateway-network.rules), unchanged from Raspberry Pi OS.
[main]
plugins=keyfile
dhcp=internal
# The setup AP uses ipv4.method=shared: NetworkManager runs dnsmasq for DHCP/DNS. No NAT is needed (the setup
# network has no upstream) and neither nft nor iptables is installed, so no firewall backend.
firewall-backend=none

[device]
wifi.scan-rand-mac-address=no
