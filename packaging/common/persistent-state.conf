# Persistent system state on the data partition (ADR 0107): survives reboots and OS updates.
# <directory under /var/lib/nibe-gateway/system> <mount point> <mode>
NetworkManager /var/lib/NetworkManager 0700
connections /etc/NetworkManager/system-connections 0700
ssh /etc/ssh 0755
tailscale /var/lib/tailscale 0700
