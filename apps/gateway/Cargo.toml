[package]
name = "nibe-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
serial = ["nibe-device-f730/serial"]
default = []
network-manager = ["nibe-network/network-manager"]
dev = ["nibe-core/dev", "nibe-simulator/dev", "nibe-api/dev"]

[dependencies]
nibe-device-f730 = { path = "../../crates/device-f730" }
nibe-network = { path = "../../crates/network" }
nibe-persistence = { path = "../../crates/persistence" }
nibe-mqtt = { path = "../../crates/mqtt" }
nibe-history = { path = "../../crates/history" }
nibe-core.workspace = true
nibe-simulator.workspace = true
nibe-api.workspace = true
tokio.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tower-http.workspace = true
