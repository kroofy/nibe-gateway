[workspace]
resolver = "2"
members = ["crates/protocol", "crates/device-f730", "crates/core", "crates/simulator", "crates/api", "crates/network", "crates/persistence", "apps/gateway", "crates/updater", "crates/system", "crates/mqtt", "crates/history"]
default-members = ["apps/gateway"]

[workspace.package]
version = "0.1.28"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
nibe-core = { path = "crates/core" }
nibe-simulator = { path = "crates/simulator" }
nibe-api = { path = "crates/api" }
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread", "sync", "time", "net", "signal", "io-util"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
utoipa = { version = "5", features = ["axum_extras"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
tower-http = { version = "0.6", features = ["fs"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
